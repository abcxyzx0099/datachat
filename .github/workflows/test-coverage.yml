# Test and Coverage Reporting Workflow
# Runs tests with coverage reporting on every push and pull request

name: Tests with Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test with Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          # Run pytest with coverage
          # --cov-fail-under: Fail if coverage drops below threshold (raised to 80%)
          # --cov-report=term: Show summary in terminal
          # --cov-report=xml: Generate XML for reporting
          # --cov-report=html: Generate HTML report with per-module breakdown
          # --cov-report=json: Generate JSON for programmatic access
          python -m pytest \
            --cov=agent \
            --cov=utils \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=json \
            --cov-branch \
            --cov-context=test \
            --cov-fail-under=80 \
            --cov-combine-report \
            --verbose

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-python-${{ matrix.python-version }}
          fail_ci_if_error: false  # Don't fail if Codecov is down
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional: requires Codecov token

      - name: Upload coverage reports as artifacts
        if: always()  # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 30

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request' && success()
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

      - name: Coverage summary
        if: success()
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --skip-covered >> $GITHUB_STEP_SUMMARY || true
