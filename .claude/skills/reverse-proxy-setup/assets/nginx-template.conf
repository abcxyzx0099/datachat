# Nginx Reverse Proxy Configuration Template
# Replace placeholders: {DOMAIN}, {PORT1}, {PORT2}, {PORT3}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name {DOMAIN} www.{DOMAIN};

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {DOMAIN} www.{DOMAIN};

    # SSL Certificate paths (will be created by certbot)
    ssl_certificate /etc/letsencrypt/live/{DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Client upload size (adjust if needed)
    client_max_body_size 100M;

    # ===============================
    # Service 1: LangGraph Studio
    # Routes: /studio, /studio/*
    # Backend: 127.0.0.1:{PORT1}
    # ===============================
    location /studio/ {
        proxy_pass http://127.0.0.1:{PORT1}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Handle /studio without trailing slash - redirect to /studio/
    location = /studio {
        return 301 /studio/;
    }

    # ===============================
    # Service 2: API Backend
    # Routes: /api, /api/*
    # Backend: 127.0.0.1:{PORT2}
    # ===============================
    location /api/ {
        proxy_pass http://127.0.0.1:{PORT2}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Handle /api without trailing slash - redirect to /api/
    location = /api {
        return 301 /api/;
    }

    # ===============================
    # Service 3: Frontend (Default)
    # Routes: /, /*
    # Backend: 127.0.0.1:{PORT3}
    # ===============================
    location / {
        proxy_pass http://127.0.0.1:{PORT3};
        proxy_http_version 1.1;
        # WebSocket support for Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
