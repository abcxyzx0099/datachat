[project]
name = "survey-analyzer"
version = "0.4.0"
description = "SPSS Survey Analysis Library - Pure Python: transformation, crosstabs, statistics (no PSPP dependency)"
readme = "src/survey_analyzer/README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DataChat Team"}
]
keywords = ["spss", "survey", "analysis", "statistics", "crosstab", "chi-square", "pandas"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0.0",
    "pyreadstat>=1.2.0",
    "python-pptx>=0.6.21",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "zai-sdk>=0.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "coverage[toml]>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
survey-analyzer = "survey_analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
show_missing = true
sort = "Cover"
precision = 1

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
