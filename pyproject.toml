[project]
name = "datachat-spss-analyzer"
version = "1.0.0"
description = "DataChat SPSS Analyzer - LangGraph-based survey analysis tool"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --strict-markers --strict-config"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, may use external services)",
    "e2e: End-to-end tests (slowest, full workflow)",
    "slow: Slow-running tests",
    "llm: Tests that call LLM APIs (requires API keys)",
]

[tool.coverage.run]
source = ["agent", "utils"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true
parallel = true
context = "test"

[tool.coverage.report]
fail_under = 80.0
show_missing = true
sort = "Cover"
precision = 1
skip_empty = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

# Per-module coverage targets (for tracking and documentation):
# Note: Individual module thresholds are tracked via coverage.json and htmlcov/
# Use: python3 -c "import json; print(json.load(open('coverage.json'))['files'])"
#
# HIGH PRIORITY MODULES (need tests to reach 70%):
# - agent/server.py: 0% → 70%
# - agent/nodes/phase5_statistics.py: 7.8% → 70%
# - agent/nodes/phase6_filtering.py: 4.1% → 70%
#
# MEDIUM PRIORITY MODULES (need tests to reach 70%):
# - agent/config.py: 29% → 70%
# - agent/styling.py: 41.6% → 70%
# - agent/nodes/phase4_tables.py: 49.8% → 70%
# - agent/nodes/phase2_recoding.py: 78.4% → 80%
# - agent/nodes/phase7_powerpoint.py: 27.8% → 70%

[tool.coverage.html]
directory = "htmlcov"
title = "DataChat SPSS Analyzer - Coverage Report"
show_contexts = true
skip_covered = false
# Per-module coverage targets for tracking:
# agent/server.py: 0% → 70% (HIGH PRIORITY)
# agent/nodes/phase5_statistics.py: 7.8% → 70% (HIGH PRIORITY)
# agent/nodes/phase6_filtering.py: 4.1% → 70% (HIGH PRIORITY)
# agent/config.py: 29% → 70% (MEDIUM PRIORITY)
# agent/styling.py: 41.6% → 70% (MEDIUM PRIORITY)
# agent/nodes/phase4_tables.py: 49.8% → 70% (MEDIUM PRIORITY)

[tool.coverage.xml]
output = "coverage.xml"
branch_coverage = true

[tool.coverage.json]
output = "coverage.json"
pretty_print = true
branch_coverage = true
